name: Deploy API Poller to Prod

on:
  push:
    branches:
      - main
    paths:
      - 'components/api-poller/**'
      - '.github/workflows/deploy-poller.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  # 1. TEST JOB: Runs immediately, no approval required
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/api-poller
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        run: |
          pip install -r src/requirements.txt
          pip install boto3 pytest responses time-machine polars
          python -m pytest test/

  # 2. DEPLOY JOB: Waits for tests, then requires manual approval
  deploy:
    needs: test                     # <--- Forces this job to wait for the test job to pass
    environment: production         # <--- Pauses here for your manual click
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/api-poller
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Debug OIDC Token Payload
        uses: actions/github-script@v7
        with:
          script: |
            // Request the token exactly like AWS does
            const token = await core.getIDToken('sts.amazonaws.com');
            
            // A JWT has 3 parts separated by dots. The payload is the middle part.
            const payload = token.split('.')[1];
            
            // Decode the base64 payload into readable JSON
            const decoded = Buffer.from(payload, 'base64').toString('utf-8');
            
            console.log("=== EXACT PAYLOAD SENT TO AWS ===");
            console.log(JSON.parse(decoded)); 
            
      - name: Assume AWS OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::246814138413:role/aws-sam-cli-managed-prod-pipe-PipelineExecutionRole-ATQOgMHPR7WL
          aws-region: ap-northeast-1

      - name: Build SAM application
        run: sam build --use-container

      - name: Deploy SAM application
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
