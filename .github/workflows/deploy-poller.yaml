name: Deploy API Poller to Prod

on:
  push:
    branches:
      - main
    paths:
      # Only trigger this pipeline if files in the poller folder or this yaml change
      - 'components/api-poller/**'
      - '.github/workflows/deploy-poller.yaml'

# CRITICAL: These permissions are required for the OIDC trust handshake to work
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    # Tell the GitHub runner to execute all commands inside our microservice folder
    defaults:
      run:
        working-directory: components/api-poller

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        run: |
          pip install -r src/requirements.txt
          pip install pytest responses time-machine polars
          python -m pytest test/

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Assume AWS OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Replace this with the full ARN from your AWS Console
          role-to-assume: arn:aws:iam::246814138413:role/aws-sam-cli-managed-prod-pipe-PipelineExecutionRole-ATQOgMHPR7WL
          aws-region: ap-northeast-1

      - name: Build SAM application
        run: sam build --use-container

      - name: Deploy SAM application
        # --no-confirm-changeset overrides the true value in your samconfig.toml so the pipeline doesn't hang waiting for user input
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset