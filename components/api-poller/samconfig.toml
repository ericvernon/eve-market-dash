s3_bucket = "aws-sam-cli-managed-prod-pipeline--artifactsbucket-0zuhxq4a9m0t"
role_arn = "arn:aws:iam::246814138413:role/aws-sam-cli-managed-prod--CloudFormationExecutionRo-1rqGfyMBHOvQ"

