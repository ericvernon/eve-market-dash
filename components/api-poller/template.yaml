AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Eve Market - API Poller Microservice

Parameters:
  BronzeBucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /eve-market/infra/bronze-bucket-name

Resources:
  ApiPollerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: eve-market-api-poller-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  ApiPollerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: eve-market-api-poller-queue
      VisibilityTimeout: 180  # 3x the Lambda timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ApiPollerDeadLetterQueue.Arn
        maxReceiveCount: 3

  ProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/producer
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128  # Minimum
      Events:
        ApiPollerScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
      Environment:
        Variables:
          QUEUE_URL: !Ref ApiPollerQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ApiPollerQueue.QueueName

  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/consumer
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          RAW_DATA_BUCKET: !Ref BronzeBucketName
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BronzeBucketName
        - SQSPollerPolicy:
            QueueName: !GetAtt ApiPollerQueue.QueueName
      Events:
        ApiPollerQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ApiPollerQueue.Arn
            BatchSize: 1
